          .finova-static-glow-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(460px, 85vw);
            height: min(460px, 85vw);
            border-radius: 9999px;
            background-color: #8D6346;
            filter: blur(120px);
            -webkit-filter: blur(120px);
            animation: finovaStaticPulse 2.8s ease-in-out infinite;
            pointer-events: none;
          }
          .finova-static-medallion {
            width: min(240px, 60vw);
            height: min(240px, 60vw);
            aspect-ratio: 1/1;
            border-radius: 9999px;
            position: relative;
            background-color: rgba(43, 35, 33, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.3), 0 20px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            padding: 32px;
          }

            font-size: clamp(2.2rem, 7vw, 2.8rem);

            letter-spacing: -0.02em;
            margin-top: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);

            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            border-radius: 9999px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            font-size: 12px;
            font-weight: 600;
